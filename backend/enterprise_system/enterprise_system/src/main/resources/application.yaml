
spring:
  application:
    name: enterprise_system

  datasource:
    url: jdbc:mysql://localhost:3306/enterprise_operations_db?createDatabaseIfNotExist=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080
  error:
    include-message: always


app:
  jwt:
    secret: ${JWT_SECRET}
    expiration: 86400000

  bootstrap-admin:
    name: ${BOOTSTRAP_ADMIN_NAME:}
    email: ${BOOTSTRAP_ADMIN_EMAIL:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}

